# Single-binary Loki on the filesystem. Labels stay few on purpose (service,
# level); trace ids live inside the line, not in the index.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Structured metadata is where per-line fields that must not become labels
  # (trace_id, span_id) can still be queried without a full-text scan.
  allow_structured_metadata: true
  volume_enabled: true

analytics:
  reporting_enabled: false
