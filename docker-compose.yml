# The whole stack: the two services, their Redis and PostgreSQL, and the
# telemetry pipeline — OpenTelemetry Collector, Tempo, Loki, Prometheus,
# Alloy, Grafana. One command:
#
#   docker compose up --build --wait
#   open http://localhost:3001            # grafana (anonymous admin, local only)
#   ./scripts/break-it.sh                 # traffic that makes the dashboards interesting
#
# Ports: api 3000 · grafana 3001 · prometheus 9090 · tempo 3200 · loki 3100 ·
# alloy 12345 · collector 4317/4318 (OTLP) and 8889 (re-exported metrics with exemplars).
name: node-observability-stack

services:
  # ---- the demo -------------------------------------------------------------
  api:
    build:
      context: .
      args: { SERVICE: api }
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/orders
      REDIS_URL: redis://redis:6379
      QUEUE_NAME: orders
      LOG_LEVEL: info
      SLOW_PRICING_MS: 1500
      OTEL_SERVICE_NAME: api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      DEPLOYMENT_ENVIRONMENT: compose
    ports:
      - '3000:3000'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      otel-collector: { condition: service_started }
    # Room for the drain and the final span export before compose sends SIGKILL.
    stop_grace_period: 15s

  worker:
    build:
      context: .
      args: { SERVICE: worker }
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/orders
      REDIS_URL: redis://redis:6379
      QUEUE_NAME: orders
      API_URL: http://api:3000
      WORKER_CONCURRENCY: 5
      WORKER_METRICS_PORT: 9464
      HEALTHCHECK_PORT: 9464
      HEALTHCHECK_PATH: /healthz
      LOG_LEVEL: info
      OTEL_SERVICE_NAME: worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      DEPLOYMENT_ENVIRONMENT: compose
    depends_on:
      api: { condition: service_healthy }
    stop_grace_period: 15s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d orders']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 15

  # ---- the pipeline ---------------------------------------------------------
  otel-collector:
    # The single ingestion point: OTLP in from the services, scrapes their
    # /metrics, and fans out to Tempo and Prometheus. See otel/collector.yaml.
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    volumes:
      - ./otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP
      - '8889:8889' # re-exported metrics, OpenMetrics with exemplars
      - '13133:13133' # health_check extension
    depends_on:
      tempo: { condition: service_healthy }

  tempo:
    image: grafana/tempo:2.6.1
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - '3200:3200'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3200/ready || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20

  loki:
    image: grafana/loki:3.3.2
    command: ['-config.file=/etc/loki/loki.yaml']
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - '3100:3100'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3100/ready || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30

  prometheus:
    image: prom/prometheus:v3.0.1
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=1d'
      # Off by default: exemplars are stored in memory next to the samples.
      - '--enable-feature=exemplar-storage'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    ports:
      - '9090:9090'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9090/-/ready || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20

  alloy:
    # Reads container logs from the Docker socket and ships the two demo
    # services' lines to Loki. See alloy/config.alloy.
    image: grafana/alloy:v1.5.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - '12345:12345'
    depends_on:
      loki: { condition: service_healthy }

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '3001:3000'
    depends_on:
      prometheus: { condition: service_healthy }
      tempo: { condition: service_healthy }
      loki: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  tempo-data:
  loki-data:
